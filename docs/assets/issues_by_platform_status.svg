      <line x1="490" y1="135" x2="490" y2="575"/>
      <line x1="570" y1="135" x2="570" y2="575"/>
      <line x1="650" y1="135" x2="650" y2="575"/>
      <line x1="730" y1="135" x2="730" y2="575"/>
      <line x1="810" y1="135" x2="810" y2="575"/>
