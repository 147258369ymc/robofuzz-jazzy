schema_version: 1
name: slam_toolbox_jazzy
display_name: slam_toolbox Jazzy (on TurtleBot4 base)
status: in_progress

environment:
  ubuntu: "24.04"
  ros_distro: jazzy
  gazebo: harmonic

packages:
  apt:
    - ros-jazzy-turtlebot4-simulator
    - ros-jazzy-irobot-create-nodes
    - ros-jazzy-slam-toolbox

# slam_toolbox rides on the TurtleBot4 mobile base. Reusing family=turtlebot
# inherits the verified TB4 bring-up, readiness gate, /cmd_vel TwistStamped
# driving, and mutation field whitelist. Only the watched topics and oracle
# diverge: the fuzzer drives legitimate motion via /cmd_vel and the SLAM oracle
# compares the slam_toolbox pose estimate against the Gazebo ground truth.
target:
  family: turtlebot
  generation: turtlebot4
  default_model: standard
  supported_models:
    - standard
    - lite
  slam: slam_toolbox

launch:
  adapter: split_headless_ros_gz_launch
  package: turtlebot4_gz_bringup
  launch_file: turtlebot4_gz.launch.py
  args:
    headless: true
    model: standard
    gazebo: ignition
    rviz: false
    gz_args: "-s -r"
    xvfb: true
    world: slam_arena
  command:
    - ./run_target.sh
    - slam_toolbox_jazzy
  compatibility_note: >
    run_target.sh slam_toolbox_jazzy first brings up the same split headless
    TurtleBot4 sim as turtlebot4_jazzy, then uses slam_toolbox's official
    online_sync lifecycle launch with autostart enabled (mode: mapping) and
    a profile-specific copy of the official TurtleBot4 slam parameters. The
    profile changes only check_min_dist_and_heading_precisely=true so either
    the distance or heading threshold can admit a scan into matching.

readiness:
  required_log_patterns:
    - "Turtlebot4 standard running."
    - "Configured and activated diffdrive_controller"
    - "[LifecycleLaunch] Slamtoolbox node is activating."
  required_topics_with_data:
    /odom: nav_msgs/msg/Odometry
    /sim_ground_truth_pose: nav_msgs/msg/Odometry
  # TB4 base + slam_toolbox bring-up runs slower under the fuzzer's per-round
  # relaunch (gazebo restart + slam node competing for CPU during the
  # diffdrive handshake). Standalone bring-up activates diffdrive ~90s; give a
  # 240s budget so readiness has margin. Other profiles keep their defaults.
  timeout_sec: 240
  compatibility_note: >
    Readiness reuses the two verified TurtleBot4 base log markers and the
    stable activation message emitted by the official online_sync lifecycle
    launch, then requires live /odom and ground-truth pose samples before
    fuzzing. A process name alone is insufficient because a LifecycleNode can
    exist in the unconfigured state without subscribing to /scan. /pose stays
    out of readiness because it is event-driven after enough robot travel.

input:
  mode: velocity_command
  preferred:
    topic: /cmd_vel
    type: geometry_msgs/msg/TwistStamped
  fallback:
    topic: /cmd_vel
    type: geometry_msgs/msg/Twist
  compatibility_note: Same command surface as turtlebot4_jazzy.

watch:
  required:
    /sim_ground_truth_pose: nav_msgs/msg/Odometry
    /odom: nav_msgs/msg/Odometry
  optional:
    /pose: geometry_msgs/msg/PoseWithCovarianceStamped
    /scan: sensor_msgs/msg/LaserScan
    /map: nav_msgs/msg/OccupancyGrid
    /cmd_vel: geometry_msgs/msg/TwistStamped
    /clock: rosgraph_msgs/msg/Clock
    /bumper_contact: ros_gz_interfaces/msg/Contacts
    /tf: tf2_msgs/msg/TFMessage
    /tf_static: tf2_msgs/msg/TFMessage
  compatibility_note: >
    /pose is the slam_toolbox corrected pose estimate. It is OPTIONAL (not a
    required readiness topic) because slam_toolbox only publishes /pose data
    after enough translational or angular travel produces a successful scan
    match — but the robot does not move until fuzzing starts, which does not
    start until readiness passes. Requiring /pose data at startup therefore
    deadlocks. /pose is still recorded (watchlist = required + optional) and
    consumed by the oracle at check time. /sim_ground_truth_pose (Gazebo truth,
    remapped from the create3 odometry plugin) and /odom are advertised at
    startup and stay required. /map and /scan are optional so recording quality
    does not fail readiness. /tf and /tf_static are optional evidence for
    frame-chain and timing checks; their absence never becomes a readiness
    failure or a standalone oracle error.

oracle:
  module: oracles.slam
  mode: slam_toolbox_jazzy
  status: in_progress
  initial_properties:
    - slam_estimate_tracks_ground_truth
    - relative_pose_error_bound
    - absolute_trajectory_error_bound
    - heading_drift_bound
  threshold_policy: >
    Drift thresholds are calibrated from the 100-round clean Jazzy campaign
    logs_jazzy/slam_clean_100_motion_pubfix with roughly ten percent headroom:
    RPE 0.019 m, ATE RMSE 0.0066 m, and yaw drift 0.023 rad. Recalibrate them
    when the target version, world, command timing, or observation path changes.

aliases:
  do_not_map:
    - --tb3-sitl
    - --tb4-sitl
